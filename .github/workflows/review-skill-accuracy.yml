name: Review skill accuracy

# The skills summarize developer.vippsmobilepay.com, so they go stale when an API
# changes. check-sources.yml catches pages that disappear. This catches the harder
# case: the page still exists, but a value in it changed and the skill still states
# the old one.
#
# It never pushes to main. It opens a draft pull request for a human to judge.
#
# Requires the ANTHROPIC_API_KEY secret. Without it the job reports a notice and
# exits successfully, so the repository does not accumulate red runs before the
# secret is provisioned.

on:
  schedule:
    # 07:00 UTC on the first of each month.
    - cron: "0 7 1 * *"
  workflow_dispatch:
    inputs:
      skills:
        description: "Skills to review, comma separated. Empty means all of them."
        required: false
        default: ""

permissions:
  contents: write
  pull-requests: write

concurrency:
  group: review-skill-accuracy
  cancel-in-progress: false

jobs:
  review:
    runs-on: ubuntu-latest
    steps:
      - name: Check for the API key
        id: guard
        env:
          ANTHROPIC_API_KEY: ${{ secrets.ANTHROPIC_API_KEY }}
        run: |
          if [ -z "${ANTHROPIC_API_KEY}" ]; then
            echo "configured=false" >> "$GITHUB_OUTPUT"
            echo "::notice title=Accuracy review skipped::Set the ANTHROPIC_API_KEY secret to enable this workflow."
          else
            echo "configured=true" >> "$GITHUB_OUTPUT"
          fi

      - uses: actions/checkout@v4
        if: steps.guard.outputs.configured == 'true'

      - uses: anthropics/claude-code-action@v1
        if: steps.guard.outputs.configured == 'true'
        with:
          anthropic_api_key: ${{ secrets.ANTHROPIC_API_KEY }}
          github_token: ${{ secrets.GITHUB_TOKEN }}
          claude_args: --model claude-sonnet-5
          prompt: |
            You are auditing the Vipps MobilePay agent skills in this repository for factual drift
            against the published documentation. Requested skills: "${{ inputs.skills }}" (empty means all).

            The skills restate facts from developer.vippsmobilepay.com. Your job is to find places where
            the documentation now says something different, and to fix only those places.

            Steps:

            1. Read `plugins/vipps/sources.json`. It maps each skill to the documentation pages its
               content is derived from.
            2. For each skill in scope, fetch its declared pages. Every page is raw Markdown: the URL is
               the site value plus the path, for example
               https://developer.vippsmobilepay.com/docs/APIs/epayment-api/quick-start.md
            3. Compare the checkable claims in `plugins/vipps/skills/<skill>/SKILL.md` and its
               `references/*.md` against those pages. Concentrate on things that change and that break an
               integration when wrong:
               - endpoint paths, HTTP methods, and required fields
               - enum values: payment states, charge states, agreement statuses, user flows, scopes
               - numbers: limits, minimums and maximums, deadlines, retry windows, token lifetimes,
                 rate limits, timeouts
               - error codes and their meanings
               - which features need separate approval or activation
            4. Ignore wording, tone, ordering, and formatting. A difference in phrasing is not drift.

            Rules:

            - Change nothing outside `plugins/vipps/`.
            - Only state what a fetched page supports. Never fill a gap from memory. If the documentation
              is ambiguous or contradicts itself, keep the existing hedge rather than picking a side.
            - Keep edits minimal and in the surrounding style: short sentences, lines wrapped at about
              120 characters, American English, and no "&" in prose.
            - If a page moved, update both the skill link and `plugins/vipps/sources.json`.
            - Run `python scripts/check_sources.py` before finishing and make sure it passes.

            Outcome:

            - If you found nothing, make no changes and say clearly that the skills match the
              documentation. Do not open a pull request.
            - If you found real drift, commit to a new branch named `skill-accuracy/<yyyy-mm-dd>` and open
              a **draft** pull request. Title it plainly, for example
              "Update recurring skill for changed charge limits". In the body, list each change as: the
              file, what the skill said, what the documentation says now, and the source URL. Add a short
              note about anything you were unsure about, so the reviewer knows where to look hardest.
