name: Bump plugin versions

on:
  pull_request:
    types: [closed]
    paths:
      - 'plugins/**'

permissions:
  contents: write

jobs:
  bump:
    if: github.event.pull_request.merged == true
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          ref: ${{ github.event.pull_request.base.ref }}
          fetch-depth: 0

      - name: Bump minor version of changed plugins
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          PR: ${{ github.event.pull_request.number }}
          BASE_SHA: ${{ github.event.pull_request.base.sha }}
        run: |
          set -euo pipefail

          files=$(gh api "repos/$GITHUB_REPOSITORY/pulls/$PR/files" --paginate --jq '.[].filename')
          plugins=$(printf '%s\n' "$files" | awk -F/ '$1 == "plugins" && NF > 2 { print $2 }' | sort -u)

          for plugin in $plugins; do
            source_manifest="plugins/$plugin/.claude-plugin/plugin.json"
            [ -f "$source_manifest" ] || continue

            current=$(jq -r .version "$source_manifest")
            previous=$(git show "$BASE_SHA:$source_manifest" | jq -r .version)

            if [ "$current" != "$previous" ]; then
              # A PR that sets the version itself (e.g. a release) is authoritative,
              # so keep its number and only spread it to the other manifests.
              next="$current"
              echo "$plugin: keeping $current from PR #$PR"
            else
              IFS=. read -r major minor _patch <<<"$current"
              next="$major.$((minor + 1)).0"
              echo "$plugin: $current -> $next"
            fi

            for manifest in plugins/"$plugin"/.*-plugin/plugin.json; do
              sed -i -E "s/(\"version\"[[:space:]]*:[[:space:]]*\")[0-9]+\.[0-9]+\.[0-9]+\"/\1$next\"/" "$manifest"
            done
          done

          if git diff --quiet; then
            echo "No version changes to commit"
            exit 0
          fi

          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git commit -am "Bump plugin versions after #$PR"
          git push
